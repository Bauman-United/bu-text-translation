services:
  bot:
    build: .
    container_name: vk-translation-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent state. MUST be mounted: it holds the game schedules and the
      # VK refresh token — losing it means no monitoring windows and a manual
      # re-run of scripts/vk_authorize.py.
      - ./data:/app/data
      # Logs
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
